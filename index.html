<style>
:root{
  --paper:#F1F4F3;
  --surface:#FFFFFF;
  --surface-sunk:#E8EDEC;
  --ink:#12262A;
  --muted:#5C7076;
  --faint:#67797F;
  --line:#D6DFDD;
  --line-soft:#E4EAE9;
  --accent:#0B6E75;
  --accent-ink:#FFFFFF;
  --accent-soft:#DCEDED;
  --landmark:#B3541E;
  --landmark-soft:#F6E7DC;
  --warn:#8A6D3B;
  --warn-soft:#F2EADA;
  --shadow:0 1px 2px rgba(18,38,42,.06),0 8px 24px -12px rgba(18,38,42,.18);
  --radius:10px;
  --font-display:'Black Han Sans','IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,-apple-system,sans-serif;
  --font-mono:ui-monospace,'SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1719;
    --surface:#162226;
    --surface-sunk:#101B1E;
    --ink:#E4EDEB;
    --muted:#94A9AD;
    --faint:#92A6AB;
    --line:#26383C;
    --line-soft:#1E2E32;
    --accent:#4FBFC4;
    --accent-ink:#07191B;
    --accent-soft:#173A3C;
    --landmark:#E5946A;
    --landmark-soft:#33221A;
    --warn:#C9AE7A;
    --warn-soft:#2A2418;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1719;
  --surface:#162226;
  --surface-sunk:#101B1E;
  --ink:#E4EDEB;
  --muted:#94A9AD;
  --faint:#92A6AB;
  --line:#26383C;
  --line-soft:#1E2E32;
  --accent:#4FBFC4;
  --accent-ink:#07191B;
  --accent-soft:#173A3C;
  --landmark:#E5946A;
  --landmark-soft:#33221A;
  --warn:#C9AE7A;
  --warn-soft:#2A2418;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:17px;
  line-height:1.62;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:780px;margin:0 auto;padding:0 16px calc(88px + env(safe-area-inset-bottom))}

/* ── masthead ───────────────────────────── */
.masthead{padding:22px 0 14px;border-bottom:1px solid var(--line)}
.masthead h1{
  font-family:var(--font-display);
  font-size:clamp(30px,8vw,44px);
  line-height:1.05;
  margin:0;
  letter-spacing:.01em;
  text-wrap:balance;
}
.masthead h1 .n{color:var(--accent)}
.masthead .sub{
  margin:8px 0 0;
  color:var(--muted);
  font-size:15px;
}
.masthead .sub b{
  font-family:var(--font-mono);
  font-weight:500;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}

/* ── toolbar ────────────────────────────── */
.toolbar{
  position:sticky;top:0;z-index:20;
  background:var(--paper);
  padding:10px 0 8px;
  border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:8px;
}
.toolbar::before{
  content:"";position:absolute;left:-16px;right:-16px;top:0;bottom:0;
  background:var(--paper);z-index:-1;
}
.searchrow{display:flex;gap:8px}
.search{
  flex:1;min-width:0;
  font:inherit;font-size:17px;
  color:var(--ink);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:13px 14px;
}
.search::placeholder{color:var(--faint)}
.search:focus-visible,.chip:focus-visible,.btn:focus-visible,.toggle:focus-visible,.lnk:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
.btn{
  font:inherit;font-size:15px;font-weight:600;
  white-space:nowrap;min-height:48px;
  color:var(--accent);
  background:var(--surface);
  border:1px solid var(--accent);
  border-radius:var(--radius);
  padding:0 16px;
  cursor:pointer;
}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}

.rail{
  display:flex;gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:1px;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  user-select:none;-webkit-user-select:none;
  cursor:grab;
}
.rail::-webkit-scrollbar{display:none}
.rail.dragging{cursor:grabbing;scroll-behavior:auto}
/* 더 있다는 표시: 잘리는 쪽 끝을 흐리게 */
.rail.fade-r{
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);
}
.rail.fade-l{
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 34px);
  mask-image:linear-gradient(90deg,transparent,#000 34px);
}
.rail.fade-l.fade-r{
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 34px,#000 calc(100% - 34px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 34px,#000 calc(100% - 34px),transparent);
}
.rail-label{
  flex:none;align-self:center;
  font-size:13px;font-weight:700;
  letter-spacing:.08em;
  color:var(--faint);
  padding-right:2px;
}
.chip{
  flex:none;
  font:inherit;font-size:15px;
  color:var(--muted);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:999px;
  padding:0 15px;min-height:42px;
  cursor:pointer;
  white-space:nowrap;
}
.chip .c{
  font-family:var(--font-mono);font-size:13px;
  color:var(--faint);margin-left:5px;
  font-variant-numeric:tabular-nums;
}
.chip[aria-pressed="true"]{
  background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
}
.chip[aria-pressed="true"] .c{color:var(--accent-ink);opacity:.7}

/* ── status line ────────────────────────── */
.statusbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 0 4px;
}
.toggle{
  font:inherit;font-size:15px;
  display:inline-flex;align-items:center;gap:7px;
  color:var(--muted);
  background:none;border:1px solid var(--line);
  border-radius:999px;padding:0 15px;min-height:42px;cursor:pointer;
}
.toggle .dot{
  width:8px;height:8px;border-radius:2px;
  background:var(--line);
}
.toggle[aria-pressed="true"]{color:var(--landmark);border-color:var(--landmark)}
.toggle[aria-pressed="true"] .dot{background:var(--landmark)}
.count{
  margin-left:auto;
  font-family:var(--font-mono);font-size:14px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.geonote{
  font-size:14.5px;color:var(--muted);
  padding:4px 0 0;width:100%;
}
.geonote.err{color:var(--landmark)}

/* ── groups ─────────────────────────────── */
.group{margin-top:26px}
.group-head{
  display:flex;align-items:baseline;gap:9px;
  padding-bottom:7px;
  border-bottom:2px solid var(--ink);
}
.group-head h2{
  font-family:var(--font-display);
  font-size:24px;font-weight:400;margin:0;
  letter-spacing:.01em;
}
.group-head .c{
  font-family:var(--font-mono);font-size:14px;color:var(--muted);
  margin-left:auto;font-variant-numeric:tabular-nums;
}
.sub{margin-top:14px}
.sub-head{
  display:flex;align-items:baseline;gap:8px;
  font-size:14px;font-weight:700;
  letter-spacing:.06em;
  color:var(--accent);
  padding:0 0 5px 2px;
}

.list{
  background:var(--surface);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  overflow:hidden;
}
.place{
  display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;
  padding:15px 14px;
  border-top:1px solid var(--line-soft);
  border-left:3px solid transparent;
}
.place:first-child{border-top:none}
.place.is-landmark{border-left-color:var(--landmark);background:var(--landmark-soft)}
.place-main{flex:1 1 220px;min-width:0}
.place-name{
  margin:0;font-size:19px;font-weight:700;line-height:1.32;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
}
.badge{
  font-size:12.5px;font-weight:700;letter-spacing:.02em;
  padding:3px 9px;border-radius:5px;
  white-space:nowrap;
}
.badge.landmark{background:var(--landmark);color:#FFF}
.badge.area{background:var(--accent-soft);color:var(--accent)}
.badge.unmapped{background:var(--warn-soft);color:var(--warn)}
.place-meta{
  margin:6px 0 0;font-size:15px;color:var(--muted);
  overflow-wrap:anywhere;
}
.place-meta .b + .b::before{content:"·";color:var(--faint);padding:0 6px}
.place-meta .dist{
  font-family:var(--font-mono);font-weight:500;
  color:var(--accent);font-variant-numeric:tabular-nums;
}
.place-links{display:flex;gap:8px;flex:none;padding-top:4px;flex-wrap:wrap}
.lnk{
  font-size:15px;font-weight:600;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;
  min-height:46px;
  color:var(--muted);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:9px;
  padding:0 16px;
  white-space:nowrap;
}
.lnk.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lnk:hover{color:var(--accent);border-color:var(--accent)}

.empty{
  text-align:center;padding:48px 16px;color:var(--muted);
  border:1px dashed var(--line);border-radius:var(--radius);margin-top:24px;
}

footer{
  margin-top:40px;padding-top:18px;
  border-top:1px solid var(--line);
  font-size:14px;color:var(--muted);line-height:1.75;
}
footer b{color:var(--muted);font-weight:600}

.totop{
  position:fixed;z-index:30;
  right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
  font:inherit;font-size:15px;font-weight:700;
  min-height:50px;padding:0 20px;
  color:var(--accent-ink);background:var(--accent);
  border:none;border-radius:999px;
  box-shadow:var(--shadow);cursor:pointer;
}
@media (max-width:520px){
  .place{gap:10px}
  .place-links{width:100%}
  .lnk{flex:1;text-align:center;padding:0 8px}
  .place-meta .b-note{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>

<div class="wrap">

  <header class="masthead">
    <h1>부산 맛집 <span class="n">지도첩</span></h1>
    <p class="sub">버튼을 누르면 지도 앱이 열립니다.</p>
  </header>

  <div class="toolbar">
    <div class="searchrow">
      <input id="q" class="search" type="search" placeholder="가게 이름, 동네, 음식으로 검색" autocomplete="off">
      <button id="near" class="btn" aria-pressed="false">내 위치</button>
    </div>
    <div class="rail" id="railGu" role="group" aria-label="지역 필터"></div>
    <div class="rail" id="railCat" role="group" aria-label="종류 필터"></div>
  </div>

  <div class="statusbar">
    <button id="multi" class="toggle" aria-pressed="false"><span class="dot"></span>중복 선택</button>
    <button id="lm" class="toggle" aria-pressed="false"><span class="dot"></span>랜드마크만</button>
    <button id="reset" class="toggle" hidden>필터 해제</button>
    <span class="count" id="count"></span>
    <p class="geonote" id="geonote" hidden></p>
  </div>

  <main id="out"></main>

  <footer>
    <p><b>랜드마크</b> — 웨이팅이 매우 긴 부산 대표 맛집. <b>지역</b> — 개별 상호가 아니라 가게가 모여 있는 거리. <b>지도 미등록</b> — 간판이 없거나 카카오맵에 상호가 없어 검색 링크로 연결됩니다.</p>
    <p><b>길찾기</b>를 누르면 카카오맵이 지금 있는 곳에서 그 가게까지 가는 길을 안내합니다. 카카오맵 앱이 깔려 있으면 앱으로 열립니다.</p>
    <p><b>내 위치</b>를 누르면 브라우저가 위치를 물어보고, 허용하면 가까운 순으로 다시 정렬합니다. 위치는 이 페이지 안에서만 쓰이고 어디에도 전송되지 않습니다.</p>
  </footer>

  <button id="top" class="totop" hidden>↑ 맨 위로</button>

</div>

const $ = s => document.querySelector(s);
const state = { q:'', gu:new Set(), cat:new Set(), lm:false, pos:null, multi:false };
const RAILS = [['#railGu','gu'], ['#railCat','cat']];

/* 필터를 바꾸면 결과를 처음부터 보여준다 */
function toTop() {
  if (scrollY > 0) scrollTo({ top: 0, behavior: 'smooth' });
}
/* 칩의 눌림 표시를 상태에 맞춘다. '전체'는 아무것도 안 골랐을 때 눌림 */
function syncRail(rail, key) {
  const set = state[key];
  rail.querySelectorAll('.chip').forEach(c => {
    const v = c.dataset.v;
    c.setAttribute('aria-pressed', String(v === '' ? set.size === 0 : set.has(v)));
  });
}
function syncAll() { RAILS.forEach(([sel, key]) => syncRail($(sel), key)); }

const MAJORS = [...new Set(PLACES.map(p => p.major))];
const majorLabel = m => m.replace(/^\d+\.\s*/, '');
const chipLabel = m => majorLabel(m).replace(/\s*\(.*\)$/, '');
const GUS = (() => {
  const m = new Map();
  PLACES.forEach(p => { if (p.gu) m.set(p.gu, (m.get(p.gu) || 0) + 1); });
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
})();

function chip(rail, label, value, key, count) {
  const b = document.createElement('button');
  b.className = 'chip';
  b.type = 'button';
  b.innerHTML = label + (count != null ? ' <span class="c">' + count + '</span>' : '');
  b.addEventListener('click', () => {
    const set = state[key];
    if (value === '') {
      set.clear();                                   // '전체' = 이 줄의 선택 해제
    } else if (state.multi) {
      set.has(value) ? set.delete(value) : set.add(value);
    } else {
      const on = set.has(value);
      set.clear();
      if (!on) set.add(value);
    }
    syncRail(rail, key);
    render();
    toTop();
  });
  b.dataset.v = value;
  rail.appendChild(b);
}

(function buildRails() {
  const rg = $('#railGu'), rc = $('#railCat');
  rg.innerHTML = '<span class="rail-label">지역</span>';
  chip(rg, '전체', '', 'gu', PLACES.length);
  GUS.forEach(([g, n]) => chip(rg, g, g, 'gu', n));
  rc.innerHTML = '<span class="rail-label">종류</span>';
  chip(rc, '전체', '', 'cat', PLACES.length);
  MAJORS.forEach(m => chip(rc, chipLabel(m), m, 'cat', PLACES.filter(p => p.major === m).length));
  syncAll();
})();

function dist(a, b, x, y) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (y - a) * r, dLon = (x - b) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a * r) * Math.cos(y * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = km => km < 1 ? Math.round(km * 1000) + 'm' : km.toFixed(km < 10 ? 1 : 0) + 'km';

function match(p) {
  if (state.gu.size && !state.gu.has(p.gu)) return false;
  if (state.cat.size && !state.cat.has(p.major)) return false;
  if (state.lm && p.tag !== '랜드마크') return false;
  if (state.q) {
    const hay = [p.name, p.origName, p.minor, p.major, p.gu, p.dong, p.address, p.dish, p.category].join(' ').toLowerCase();
    if (!state.q.toLowerCase().split(/\s+/).every(t => hay.includes(t))) return false;
  }
  return true;
}

function placeEl(p) {
  const el = document.createElement('article');
  el.className = 'place' + (p.tag === '랜드마크' ? ' is-landmark' : '');

  const main = document.createElement('div');
  main.className = 'place-main';

  const h = document.createElement('h4');
  h.className = 'place-name';
  h.append(p.name);
  if (p.tag === '랜드마크') h.insertAdjacentHTML('beforeend', '<span class="badge landmark">랜드마크</span>');
  if (p.kind === '지역') h.insertAdjacentHTML('beforeend', '<span class="badge area">밀집 지역</span>');
  if (p.kind === '미등록') h.insertAdjacentHTML('beforeend', '<span class="badge unmapped">지도 미등록</span>');
  main.appendChild(h);

  const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const addr = p.address ? p.address.replace(/^부산\s+/, '')
                         : [p.gu, p.dong].filter(Boolean).join(' ');
  const bits = [];
  if (p._d != null) bits.push('<span class="b dist">' + fmtDist(p._d) + '</span>');
  if (addr)   bits.push('<span class="b b-addr">' + esc(addr) + '</span>');
  if (p.dish) bits.push('<span class="b b-dish">' + esc(p.dish) + '</span>');
  if (p.note) bits.push('<span class="b b-note">' + esc(p.note) + '</span>');
  const meta = document.createElement('p');
  meta.className = 'place-meta';
  meta.innerHTML = bits.join('');
  main.appendChild(meta);

  const links = document.createElement('div');
  links.className = 'place-links';
  let lh = '';
  if (p.x && p.y) lh += '<a class="lnk go" href="https://map.kakao.com/link/to/' +
    encodeURIComponent(p.name) + ',' + p.y + ',' + p.x + '" target="_blank" rel="noopener">길찾기</a>';
  lh += '<a class="lnk" href="' + p.kakao + '" target="_blank" rel="noopener">카카오맵</a>' +
        '<a class="lnk" href="' + p.naver + '" target="_blank" rel="noopener">네이버</a>';
  links.innerHTML = lh;

  el.append(main, links);
  return el;
}

function render() {
  const out = $('#out');
  out.textContent = '';
  let rows = PLACES.filter(match);

  $('#count').textContent = rows.length + ' / ' + PLACES.length + '곳';
  const active = state.q || state.gu.size || state.cat.size || state.lm;
  $('#reset').hidden = !active;

  if (!rows.length) {
    out.innerHTML = '<p class="empty">조건에 맞는 곳이 없습니다. 필터를 줄여보세요.</p>';
    return;
  }

  if (state.pos) {
    rows = rows.map(p => ({ ...p, _d: (p.x && p.y) ? dist(state.pos.lat, state.pos.lon, +p.x, +p.y) : null }))
               .sort((a, b) => (a._d ?? 1e9) - (b._d ?? 1e9));
    const g = document.createElement('section');
    g.className = 'group';
    g.innerHTML = '<div class="group-head"><h2>가까운 순</h2><span class="c">' + rows.length + '곳</span></div>';
    const list = document.createElement('div');
    list.className = 'list';
    list.style.marginTop = '14px';
    rows.forEach(p => list.appendChild(placeEl(p)));
    g.appendChild(list);
    out.appendChild(g);
    return;
  }

  MAJORS.forEach(m => {
    const inMajor = rows.filter(p => p.major === m);
    if (!inMajor.length) return;
    const g = document.createElement('section');
    g.className = 'group';
    g.innerHTML = '<div class="group-head"><h2>' + majorLabel(m) + '</h2><span class="c">' + inMajor.length + '곳</span></div>';
    [...new Set(inMajor.map(p => p.minor))].forEach(mi => {
      const items = inMajor.filter(p => p.minor === mi);
      const s = document.createElement('div');
      s.className = 'sub';
      s.innerHTML = '<div class="sub-head">' + mi + '</div>';
      const list = document.createElement('div');
      list.className = 'list';
      items.forEach(p => list.appendChild(placeEl(p)));
      s.appendChild(list);
      g.appendChild(s);
    });
    out.appendChild(g);
  });
}

$('#q').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
$('#lm').addEventListener('click', e => {
  state.lm = !state.lm;
  e.currentTarget.setAttribute('aria-pressed', String(state.lm));
  render();
  toTop();
});

/* 중복 선택 / 단일 선택 전환 */
$('#multi').addEventListener('click', e => {
  state.multi = !state.multi;
  e.currentTarget.setAttribute('aria-pressed', String(state.multi));
  if (!state.multi) {
    // 단일로 돌아갈 때 여러 개 골라뒀으면 첫 번째만 남긴다
    for (const [, key] of RAILS) {
      const set = state[key];
      if (set.size > 1) { const first = [...set][0]; set.clear(); set.add(first); }
    }
    syncAll();
    render();
  }
});
$('#reset').addEventListener('click', () => {
  state.q = ''; state.lm = false;
  state.gu.clear(); state.cat.clear();
  $('#q').value = '';
  $('#lm').setAttribute('aria-pressed', 'false');
  syncAll();
  render();
  toTop();
});

const nearBtn = $('#near'), note = $('#geonote');
const noCoord = PLACES.filter(p => !p.x || !p.y).length;
nearBtn.addEventListener('click', () => {
  if (state.pos) {
    state.pos = null;
    nearBtn.setAttribute('aria-pressed', 'false');
    nearBtn.textContent = '내 위치';
    note.hidden = true;
    render();
    return;
  }
  if (!navigator.geolocation) {
    note.hidden = false; note.className = 'geonote err';
    note.textContent = '이 브라우저는 위치 기능을 지원하지 않습니다.';
    return;
  }
  nearBtn.disabled = true; nearBtn.textContent = '확인 중…';
  note.hidden = false; note.className = 'geonote';
  note.textContent = '위치를 확인하는 중입니다. 브라우저가 물어보면 허용을 눌러주세요.';
  navigator.geolocation.getCurrentPosition(
    pos => {
      state.pos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      nearBtn.disabled = false;
      nearBtn.setAttribute('aria-pressed', 'true');
      nearBtn.textContent = '가까운 순 해제';
      const far = dist(state.pos.lat, state.pos.lon, 129.075, 35.18) > 60;
      note.textContent = far
        ? '현재 위치가 부산에서 멀어(약 ' + fmtDist(dist(state.pos.lat, state.pos.lon, 129.075, 35.18)) + ') 거리 정렬이 큰 의미는 없습니다.'
        : '내 위치에서 가까운 순으로 정렬했습니다.' + (noCoord ? ' 좌표가 없는 ' + noCoord + '곳은 맨 뒤에 있습니다.' : '');
      render();
    },
    err => {
      nearBtn.disabled = false; nearBtn.textContent = '내 위치';
      note.className = 'geonote err';
      note.textContent = err.code === 1
        ? '위치 권한이 거부되어 거리순 정렬을 쓸 수 없습니다. 지역 칩으로 골라보세요.'
        : '위치를 확인하지 못했습니다. 지역 칩으로 골라보세요.';
    },
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
  );
});

render();

/* 맨 위로 버튼 */
const topBtn = $('#top');
let topTick = false;
addEventListener('scroll', () => {
  if (topTick) return;
  topTick = true;
  requestAnimationFrame(() => { topBtn.hidden = scrollY < 700; topTick = false; });
}, { passive: true });
topBtn.addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));

/* 필터 줄: 마우스로 끌어서 넘기기 + 양끝 흐림 표시 */
document.querySelectorAll('.rail').forEach(rail => {
  const fade = () => {
    const max = rail.scrollWidth - rail.clientWidth;
    rail.classList.toggle('fade-l', max > 1 && rail.scrollLeft > 4);
    rail.classList.toggle('fade-r', max > 1 && rail.scrollLeft < max - 4);
  };
  fade();
  rail.addEventListener('scroll', fade, { passive: true });
  addEventListener('resize', fade, { passive: true });

  let down = false, dragged = false, startX = 0, startLeft = 0;

  rail.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;   // 손가락은 원래 스와이프를 그대로 씀
    down = true; dragged = false;
    startX = e.clientX; startLeft = rail.scrollLeft;
  });

  rail.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - startX;
    if (!dragged) {
      if (Math.abs(dx) < 5) return;                            // 살짝 흔들린 건 클릭으로 봄
      dragged = true;
      rail.classList.add('dragging');
      try { rail.setPointerCapture(e.pointerId); } catch (_) {}
    }
    rail.scrollLeft = startLeft - dx;
    e.preventDefault();
  });

  const stop = e => {
    if (!down) return;
    down = false;
    rail.classList.remove('dragging');
    try { rail.releasePointerCapture(e.pointerId); } catch (_) {}
  };
  rail.addEventListener('pointerup', stop);
  rail.addEventListener('pointercancel', stop);

  // 끌고 난 직후의 클릭은 필터가 눌리지 않게 막는다
  rail.addEventListener('click', e => {
    if (!dragged) return;
    dragged = false;
    e.preventDefault();
    e.stopPropagation();
  }, true);

  // 마우스 휠(세로)을 가로 이동으로
  rail.addEventListener('wheel', e => {
    if (e.shiftKey || !e.deltaY) return;
    if (rail.scrollWidth - rail.clientWidth < 1) return;
    rail.scrollLeft += e.deltaY;
    e.preventDefault();
  }, { passive: false });
});
</script>
</body>
</html>
